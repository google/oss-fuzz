# OpenSesame on OSS-Fuzz / ClusterFuzzLite. This file is the submission pack:
# copy project.yaml, Dockerfile and build.sh into projects/opensesame/ on
# google/oss-fuzz (or the CFL host's projects/ directory). Enrollment is
# recorded in docs/adr/0211-oss-fuzz-and-oss-verify-enrollment.md; the filing
# checklist lives in docs/contributing/oss-programs.md.
homepage: "https://github.com/OpenSesame-Labs/OpenSesame"
language: rust
main_repo: "https://github.com/OpenSesame-Labs/OpenSesame"
primary_contact: "contact.tylerkendrick@gmail.com"
fuzzing_engines:
  - libfuzzer
# Address only, matching the proven OSS-Fuzz Rust pattern (hyperium et al.);
# UBSan Rust builds upstream are not yet reliable enough for a first
# enrollment. Revisit after the project is accepted.
sanitizers:
  - address
architectures:
  - x86_64
# Crash reports arrive at primary_contact; public issues are not filed
# automatically. Vulnerability reports belong in SECURITY.md's private
# channel.
file_github_issue: false
