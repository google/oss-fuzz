homepage: "https://skia.googlesource.com/skia"
language: c++
primary_contact: "kjlubick@chromium.org"
auto_ccs:
  - "hcm@google.com"
  - "michaelludwig@google.com"
  - "robertphillips@google.com"
  - "egdaniel@google.com"
  - "skia-gpu-wrangler@google.com"
  - "skia-bugs-central@skia-public.iam.gserviceaccount.com"
  - "fuzz@skia.org"
  - "drott@chromium.org"
  - "fmalita@chromium.org"
vendor_ccs:
  - "lsalzman@mozilla.com"
  - "twsmith@mozilla.com"
sanitizers:
 - address
 - undefined
 - memory
# Temporary: Skia's build exceeds the 20h Cloud Build timeout, which leaves the
# last configuration in the matrix (libfuzzer/undefined) never uploading a fresh
# build. Dropping centipede removes two of the seven configurations
# (centipede/address and the unsanitized centipede/none that it requires) and
# buys back roughly 20% of the build. Restore this once the build is faster.
fuzzing_engines:
 - libfuzzer
 - afl
 - honggfuzz
help_url: "https://skia.org/docs/dev/testing/fuzz/"
builds_per_day: 4
main_repo: 'https://skia.googlesource.com/skia.git'
