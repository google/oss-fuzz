[package]
name = "flatbuffers-rust-verifier-fuzzer"
version = "0.0.0"
publish = false
edition = "2021"

# The fuzz harness itself, also kept as a library so it can be driven by
# `cargo miri run` locally (see README.md).
[lib]
name = "flatbuffers_rust_verifier_fuzzer"
path = "src/lib.rs"

# The `flatbuffers` runtime is built from the checkout in `$SRC/flatbuffers`, so
# the target always fuzzes the project's current code, never a crates.io copy.
[dependencies]
flatbuffers = { path = "../flatbuffers/rust/flatbuffers" }
