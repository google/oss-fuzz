[package]
name = "flatbuffers-rust-verifier-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
flatbuffers-rust-verifier-fuzzer = { path = ".." }

# Keep this package out of the parent package's workspace, as cargo-fuzz does by
# default: that is what puts the built targets under `fuzz/target/`.
[workspace]
members = ["."]

[[bin]]
name = "flatbuffers_rust_verifier"
path = "fuzz_targets/flatbuffers_rust_verifier.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
