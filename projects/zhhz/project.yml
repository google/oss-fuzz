homepage: "https://github.com/ljh-sh/zhhz"
language: rust
main_repo: "https://github.com/ljh-sh/zhhz.git"
fuzzing_engines:
  - libfuzzer
sanitizers:
  - address
  - memory
  - undefined
maintainers:
  - name: "ljh-sh"
    email: "lijunhao@x-cmd.com"
auto_ccs:
  - name: "ljh-sh"
    email: "lijunhao@x-cmd.com"
