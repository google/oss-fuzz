homepage: "https://github.com/tensorflow/serving"
language: c++
primary_contact: "tensorflow-serving-dev@googlegroups.com"
auto_ccs:
  - "tensorflow-security@google.com"
main_repo: "https://github.com/tensorflow/serving.git"

# TF Serving handles untrusted user input via its HTTP REST API.
# The JSON tensor parser (json_tensor.cc) is the primary attack surface —
# it processes POST request bodies for /predict, /classify, and /regress.
# CVE-2025-0649 (uncontrolled recursion → stack overflow DoS) was found here.

fuzzing_engines:
  - libfuzzer

sanitizers:
  - address
  - memory
  - undefined

architectures:
  - x86_64
